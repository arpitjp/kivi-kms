<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kivi Markdown Editor — Demo</title>
  <meta name="description" content="A high-performance, WYSIWYG-first Markdown editor with lossless round-trip editing." />
  <meta name="theme-color" content="#1e1e1e" />
  <link rel="icon" type="image/svg+xml" href="/kivi-favicon.svg" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.json" />
  <meta property="og:title" content="Kivi Markdown Editor" />
  <meta property="og:description" content="WYSIWYG Markdown editor with lossless round-trip editing." />
  <meta property="og:image" content="/icon-512.png" />
  <meta property="og:type" content="website" />
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
  <div id="app">
    <!-- Header toolbar — collapsible -->
    <header id="toolbar">
      <div id="toolbar-left">
        <span class="toolbar-brand"><svg class="kivi-brand-icon" width="16" height="16" viewBox="63 46 913 901" fill="currentColor"><path d="M618.3,816.5C580.5,830.7,541.8,838.3,501.7,837C452.2,835.5,405.7,822.5,362.1,799.5C304.6,769.2,257.9,726.9,222.7,672.1C205.8,645.7,196.4,616.3,192.6,585.1C186.3,533.4,196,484.1,214.5,436.1C237,377.4,272.1,326.9,317.3,283.5C368,234.9,426.6,199.4,494.7,180.3C527.2,171.1,560.2,166.7,593.9,168.9C651.6,172.8,700.1,195.5,738,240.1C770,277.7,796.4,318.6,813.8,365C825.5,396.2,833,428.2,836.4,461.4C841.7,511.7,836.1,560.7,819.5,608.4C804.3,652,781.1,691.1,750.3,725.5C718.1,761.4,680,789.2,636.2,809.1C630.5,811.7,624.5,813.9,618.3,816.5M716.8,281.7C700.4,249.3,674.2,228,640.6,215.5C604.6,202.1,567.6,201.4,530.3,207.7C486.8,215.1,447.2,232.4,410.1,255.9C366.5,283.5,329.1,318.1,298.2,359.6C261.6,408.8,237.1,463.1,230,524.6C226.7,553.2,228.4,581.4,236.4,609.1C249,651.9,274.4,683.8,315.7,702.1C347.9,716.3,381.7,718.2,416.1,714.3C445.9,710.9,474.4,702.1,501.5,689.5C585.2,650.7,649.5,590.7,695.1,510.8C722.2,463.2,737.5,412.2,735.6,356.8C734.8,330.7,729,305.8,716.8,281.7z"/><path d="M443.2,539.3C417.9,537.2,403.2,521.4,402.6,496.4C402.1,477.3,408.2,460.1,418,444.1C435.6,415.2,459.5,393.5,491.8,382.1C503.4,378.1,515.3,376.5,527.6,378.5C556.3,383.2,565.3,407.9,562.9,428.3C559.1,460.2,542.2,485,519,506.1C503.5,520.3,486,531.4,465.4,536.7C458.2,538.5,451.1,539.7,443.2,539.3z"/><path d="M365,473.7C376.2,479.6,377,486.4,368,494.8C354.9,507.1,325.8,510.8,310.2,502.2C302.5,497.9,301.5,492,307.7,485.7C318.5,474.6,345.6,464.7,365,473.7z"/><path d="M641.1,408.6C645.7,409.3,649.7,410.3,653.5,412.1C662,416.2,663.3,423,656.5,429.5C646.1,439.5,633.2,444.1,619.1,445.3C611.8,445.9,604.5,445.3,597.8,441.6C589.6,437,588.2,429.9,594.9,423.3C607.7,410.9,623.3,406.8,641.1,408.6z"/></svg>Kivi</span>
      </div>
      <div id="toolbar-format"></div>
      <div id="toolbar-right"></div>
    </header>

    <div id="main-layout">
      <!-- Left pane -->
      <aside id="sidebar">
        <div id="section-explorer" class="panel-section" data-section="explorer">
          <div class="section-header">
            <span class="section-drag" title="Drag to reorder or move"><svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor"><circle cx="4" cy="2.5" r="1.1"/><circle cx="8" cy="2.5" r="1.1"/><circle cx="4" cy="6" r="1.1"/><circle cx="8" cy="6" r="1.1"/><circle cx="4" cy="9.5" r="1.1"/><circle cx="8" cy="9.5" r="1.1"/></svg></span>
            <span class="sidebar-title">Explorer</span>
            <div class="section-header-actions">
              <button id="new-file-btn" type="button" title="New Page (Ctrl+N)" aria-label="Create new page"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2H4.5A1.5 1.5 0 0 0 3 3.5v9A1.5 1.5 0 0 0 4.5 14h7a1.5 1.5 0 0 0 1.5-1.5V6z"/><polyline points="9,2 9,6 13,6"/><line x1="6" y1="9.5" x2="10" y2="9.5" stroke-width="1.6"/><line x1="8" y1="7.5" x2="8" y2="11.5" stroke-width="1.6"/></svg></button>
              <button id="collapse-all-btn" type="button" title="Collapse All" aria-label="Collapse all folders"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="4,5 8,2 12,5"/><polyline points="4,11 8,8 12,11"/></svg></button>
              <button class="section-move" type="button" title="Move to other pane" aria-label="Move section"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><polyline points="2,8 5,5"/><polyline points="2,8 5,11"/><polyline points="14,8 11,5"/><polyline points="14,8 11,11"/><line x1="2" y1="8" x2="14" y2="8"/></svg></button>
              <button class="section-toggle" type="button" aria-label="Toggle section" aria-expanded="true"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><polyline points="4,6 8,10 12,6"/></svg></button>
            </div>
          </div>
          <div class="section-body">
            <div id="vault-search" style="display:none;">
              <input id="vault-search-input" type="search" placeholder="Search notes..." aria-label="Search notes" />
              <div id="vault-search-results"></div>
            </div>
            <div id="file-list" role="tree" aria-label="File explorer"></div>
          </div>
        </div>
        <div id="section-tags" class="panel-section section-collapsed" data-section="tags">
          <div class="section-header">
            <span class="section-drag" title="Drag to reorder or move"><svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor"><circle cx="4" cy="2.5" r="1.1"/><circle cx="8" cy="2.5" r="1.1"/><circle cx="4" cy="6" r="1.1"/><circle cx="8" cy="6" r="1.1"/><circle cx="4" cy="9.5" r="1.1"/><circle cx="8" cy="9.5" r="1.1"/></svg></span>
            <span class="sidebar-title">Tags</span>
            <span class="section-count">0</span>
            <div class="section-header-actions">
              <button class="section-move" type="button" title="Move to other pane" aria-label="Move section"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><polyline points="2,8 5,5"/><polyline points="2,8 5,11"/><polyline points="14,8 11,5"/><polyline points="14,8 11,11"/><line x1="2" y1="8" x2="14" y2="8"/></svg></button>
              <button class="section-toggle" type="button" aria-label="Toggle section" aria-expanded="false"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><polyline points="6,4 10,8 6,12"/></svg></button>
            </div>
          </div>
          <div class="section-body">
            <div id="tags-list"></div>
          </div>
        </div>
        <div id="section-backlinks" class="panel-section" data-section="backlinks">
          <div class="section-header">
            <span class="section-drag" title="Drag to reorder or move"><svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor"><circle cx="4" cy="2.5" r="1.1"/><circle cx="8" cy="2.5" r="1.1"/><circle cx="4" cy="6" r="1.1"/><circle cx="8" cy="6" r="1.1"/><circle cx="4" cy="9.5" r="1.1"/><circle cx="8" cy="9.5" r="1.1"/></svg></span>
            <span class="sidebar-title">Backlinks</span>
            <span class="section-count">0</span>
            <div class="section-header-actions">
              <button class="section-move" type="button" title="Move to other pane" aria-label="Move section"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><polyline points="2,8 5,5"/><polyline points="2,8 5,11"/><polyline points="14,8 11,5"/><polyline points="14,8 11,11"/><line x1="2" y1="8" x2="14" y2="8"/></svg></button>
              <button class="section-toggle" type="button" aria-label="Toggle section" aria-expanded="true"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><polyline points="4,6 8,10 12,6"/></svg></button>
            </div>
          </div>
          <div class="section-body">
            <div id="backlinks-list"></div>
          </div>
        </div>
      </aside>
      <div class="resize-handle" data-resize="left" title="Drag to resize"></div>

      <!-- Main editor area -->
      <main id="editor-container">
        <div id="breadcrumbs">
          <div id="breadcrumbs-path"></div>
          <div id="breadcrumbs-actions"></div>
        </div>
        <div id="find-widget" style="display:none;" role="search" aria-label="Find and replace">
          <div class="find-widget-row">
            <div class="find-input-wrap">
              <input id="find-input" type="text" placeholder="Find" aria-label="Search text" autocomplete="off" spellcheck="false" />
              <button id="find-case" type="button" class="find-toggle" title="Match Case (Alt+C)" aria-pressed="false">Aa</button>
              <button id="find-regex" type="button" class="find-toggle" title="Use Regular Expression (Alt+R)" aria-pressed="false">.*</button>
            </div>
            <span id="find-count" class="find-count"></span>
            <button id="find-prev" type="button" class="find-nav-btn" title="Previous Match (Shift+Enter)" aria-label="Previous match"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><polyline points="4,10 8,6 12,10"/></svg></button>
            <button id="find-next" type="button" class="find-nav-btn" title="Next Match (Enter)" aria-label="Next match"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><polyline points="4,6 8,10 12,6"/></svg></button>
            <button id="find-close" type="button" class="find-nav-btn" title="Close (Escape)" aria-label="Close find"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><line x1="4" y1="4" x2="12" y2="12"/><line x1="12" y1="4" x2="4" y2="12"/></svg></button>
          </div>
          <div class="find-widget-row">
            <div class="find-input-wrap">
              <input id="replace-input" type="text" placeholder="Replace" aria-label="Replacement text" autocomplete="off" spellcheck="false" />
            </div>
            <button id="replace-one" type="button" class="find-nav-btn" title="Replace (Ctrl+Shift+1)" aria-label="Replace"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 8h7"/><polyline points="8,5.5 10.5,8 8,10.5"/><path d="M12 3v10"/></svg></button>
            <button id="replace-all" type="button" class="find-nav-btn" title="Replace All (Ctrl+Alt+Enter)" aria-label="Replace all"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2 6h6"/><polyline points="6,3.5 8.5,6 6,8.5"/><path d="M2 11h6"/><polyline points="6,8.5 8.5,11 6,13.5"/><path d="M12 2v12"/></svg></button>
          </div>
        </div>
        <div id="editor-split">
          <div id="editor"></div>
          <div class="resize-handle" data-resize="split" title="Drag to resize split"></div>
          <div id="markdown-source"></div>
        </div>
      </main>

      <div class="resize-handle" data-resize="right" title="Drag to resize"></div>
      <!-- Right pane -->
      <aside id="outline-panel">
        <div id="section-warnings" class="panel-section section-collapsed" data-section="warnings" style="display:none;">
          <div class="section-header">
            <span class="section-drag" title="Drag to reorder or move"><svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor"><circle cx="4" cy="2.5" r="1.1"/><circle cx="8" cy="2.5" r="1.1"/><circle cx="4" cy="6" r="1.1"/><circle cx="8" cy="6" r="1.1"/><circle cx="4" cy="9.5" r="1.1"/><circle cx="8" cy="9.5" r="1.1"/></svg></span>
            <span class="sidebar-title">Issues</span>
            <span class="section-count issue-count-badge" style="background: rgba(229,168,75,0.2); color: #e5a84b;">0</span>
            <div class="section-header-actions">
              <button class="section-move" type="button" title="Move to other pane" aria-label="Move section"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><polyline points="2,8 5,5"/><polyline points="2,8 5,11"/><polyline points="14,8 11,5"/><polyline points="14,8 11,11"/><line x1="2" y1="8" x2="14" y2="8"/></svg></button>
              <button class="section-toggle" type="button" aria-label="Toggle section" aria-expanded="false"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><polyline points="6,4 10,8 6,12"/></svg></button>
            </div>
          </div>
          <div class="section-body">
            <div id="warnings-list"></div>
          </div>
        </div>
        <div id="section-outline" class="panel-section" data-section="outline">
          <div class="section-header">
            <span class="section-drag" title="Drag to reorder or move"><svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor"><circle cx="4" cy="2.5" r="1.1"/><circle cx="8" cy="2.5" r="1.1"/><circle cx="4" cy="6" r="1.1"/><circle cx="8" cy="6" r="1.1"/><circle cx="4" cy="9.5" r="1.1"/><circle cx="8" cy="9.5" r="1.1"/></svg></span>
            <span class="sidebar-title">Outline</span>
            <span class="section-count">0</span>
            <div class="section-header-actions">
              <button class="section-move" type="button" title="Move to other pane" aria-label="Move section"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><polyline points="2,8 5,5"/><polyline points="2,8 5,11"/><polyline points="14,8 11,5"/><polyline points="14,8 11,11"/><line x1="2" y1="8" x2="14" y2="8"/></svg></button>
              <button class="section-toggle" type="button" aria-label="Toggle section" aria-expanded="true"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><polyline points="4,6 8,10 12,6"/></svg></button>
            </div>
          </div>
          <div class="section-body">
            <div id="outline-list"></div>
          </div>
        </div>
      </aside>
    </div>

    <!-- Graph overlay -->
    <div id="graph-overlay" style="display:none;">
      <div id="graph-bar">
        <div id="graph-bar-left">
          <div id="graph-mode-tabs" role="tablist">
            <button class="graph-tab active" data-mode="local" role="tab" aria-selected="true">Local</button>
            <button class="graph-tab" data-mode="global" role="tab">Global</button>
            <button class="graph-tab" data-mode="hierarchy" role="tab">Hierarchy</button>
          </div>
          <span class="graph-bar-sep"></span>
          <div id="graph-edge-toggles">
            <label class="graph-toggle"><input type="checkbox" value="link" checked /><span class="dot" style="background:var(--accent)"></span>Links</label>
            <label class="graph-toggle"><input type="checkbox" value="shared-tag" checked /><span class="dot" style="background:#4ec9b0"></span>Tags</label>
            <label class="graph-toggle"><input type="checkbox" value="parent" checked /><span class="dot" style="background:#a8b4c8"></span>Hierarchy</label>
            <label class="graph-toggle"><input type="checkbox" value="sibling" /><span class="dot" style="background:#c586c0"></span>Siblings</label>
          </div>
        </div>
        <div id="graph-bar-right">
          <button id="close-graph" aria-label="Close graph view">✕</button>
        </div>
      </div>

      <!-- Search bar — hidden by default, shown via Ctrl/Cmd+F -->
      <div id="graph-search-bar" style="display:none;">
        <input id="graph-filter" type="text" placeholder="Search nodes…" aria-label="Search graph nodes" autocomplete="off" />
        <button id="graph-search-close" aria-label="Close search">✕</button>
      </div>

      <div id="graph-container"></div>
      <div id="graph-shortcuts">
        <kbd>C</kbd> center · <kbd>F</kbd> fit · <kbd>⌘F</kbd> search · <kbd>+</kbd><kbd>-</kbd> zoom · <kbd>Esc</kbd> close
      </div>
    </div>
  </div>
  <script>
    window.__kiviErrors=[];
    function __kiviShowErr(msg){
      window.__kiviErrors.push(msg);
      var d=document.getElementById('kivi-error-overlay');
      if(!d){d=document.createElement('div');d.id='kivi-error-overlay';
        d.style.cssText='position:fixed;bottom:0;left:0;right:0;max-height:40vh;overflow:auto;background:#1a0000;color:#ff6b6b;font:13px/1.5 monospace;padding:12px 16px;z-index:99999;border-top:2px solid #ff4444;white-space:pre-wrap;';
        document.body.appendChild(d);}
      d.textContent=window.__kiviErrors.join('\n\n');
    }
    window.onerror=function(m,s,l,c,e){__kiviShowErr('[onerror] '+m+'\n  at '+s+':'+l+':'+c+(e&&e.stack?'\n'+e.stack:''));};
    window.addEventListener('unhandledrejection',function(ev){__kiviShowErr('[unhandledrejection] '+(ev.reason&&ev.reason.stack||ev.reason));});
  </script>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
